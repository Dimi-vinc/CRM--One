<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#003d82" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CRM-One" />
    <title>CRM-One — CRM SaaS Multi-Tenant | LiAfrik — Dubaï & Yaoundé</title>
    <meta name="description" content="CRM-One — la plateforme CRM SaaS multi-tenant pensée pour le marché africain. Pipeline, contacts, devises panafricaines, Mobile Money, multi-tenant isolé. Par LiAfrik — Dubaï & Yaoundé." />
    <meta property="og:title" content="CRM-One — CRM SaaS pour l'Afrique" />
    <meta property="og:description" content="Pipeline, Forecast, Multi-devise & Mobile Money, isolation multi-tenant stricte." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (function() {
        var theme = localStorage.getItem('crm_theme') || 'ocean';
        var colors = {
          ocean: {
            '50': '#f0f9ff', '100': '#e0f2fe', '200': '#bae6fd', '300': '#7dd3fc', '400': '#38bdf8',
            '500': '#0369a1', '600': '#025a8b', '700': '#014a75', '800': '#013b5e', '900': '#0c2d48'
          },
          coral: {
            '50': '#fff5f0', '100': '#ffe3d1', '200': '#ffc4a3', '300': '#ffa070', '400': '#ff7e42',
            '500': '#ff6b35', '600': '#e0531f', '700': '#bc3d11', '800': '#962d0a', '900': '#7a2107'
          },
          classic: {
            '50': '#fff5f0', '100': '#ffe8da', '200': '#ffcfb5', '300': '#ffac7f', '400': '#ff7e3f',
            '500': '#fb5d1f', '600': '#ec4a0c', '700': '#c43a09', '800': '#9c3110', '900': '#7e2c11'
          }
        };
        var currentColors = colors[theme] || colors.ocean;
        var root = document.documentElement;
        Object.keys(currentColors).forEach(function(key) {
          root.style.setProperty('--color-primary-' + key, currentColors[key]);
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
